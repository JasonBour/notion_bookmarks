<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买入区监测</title>
<style>
  :root{
    --navy:#1c2b3a; --muted:#8a97a8; --line:#eef1f5;
    --head-bg:#dfeaf8; --head-tx:#24466e; --grp-bg:#cfe2f7; --grp-tx:#1f3c63;
    --green:#1e9e50; --green-bg:#e3f6e9;
    --amber:#c98a06; --amber-bg:#fdf0d3;
    --red:#e5446d; --red-bg:#fde3e9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#f5f7fa; color:var(--navy); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; padding:28px 16px; font-size:15px;}
  .wrap{max-width:760px; margin:0 auto;}
  .top{display:flex; justify-content:space-between; align-items:flex-start;}
  h1{font-size:26px; letter-spacing:.5px;}
  .count{color:var(--muted); font-size:14px; padding-top:10px; white-space:nowrap;}
  .sub{margin-top:6px; font-size:13px; color:var(--muted);}
  .legend{margin-top:8px; font-size:13px; color:#5a6b80; display:flex; gap:18px; flex-wrap:wrap;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:1px;}
  .card{background:#fff; border-radius:14px; margin-top:16px; overflow:hidden; box-shadow:0 1px 4px rgba(28,43,58,.06);}
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  thead th{background:var(--head-bg); color:var(--head-tx); font-size:14px; font-weight:600; text-align:left; padding:11px 14px;}
  thead th:last-child, td.dev{text-align:right;}
  tr.grp td{background:var(--grp-bg); color:var(--grp-tx); font-weight:700; font-size:14px; padding:9px 14px;}
  tr.grp td:last-child{text-align:right; font-weight:600; color:#4a6a94;}
  td{padding:12px 14px; border-top:1px solid var(--line); font-size:15px;}
  td.sym{font-weight:700; font-size:16px; position:relative; padding-left:18px;}
  td.sym .bar{position:absolute; left:6px; top:50%; transform:translateY(-50%); width:4px; height:22px; border-radius:3px;}
  td.prev{color:#5a6b80;}
  td.now{font-weight:700;}
  .chip{display:inline-block; min-width:86px; text-align:center; padding:5px 10px; border-radius:8px; font-weight:700; font-size:14px;}
  .chip.g{background:var(--green-bg); color:var(--green);}
  .chip.a{background:var(--amber-bg); color:var(--amber);}
  .chip.r{background:var(--red-bg); color:var(--red);}
  .chip.n{background:#eef1f5; color:var(--muted);}
  .foot{margin-top:14px; font-size:12.5px; color:var(--muted); line-height:1.9;}
  .foot a{color:#4a6a94;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-top:12px;}
  button{background:#fff; border:1px solid #d7dfe9; color:var(--navy); border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer;}
  button:hover{border-color:#9fb4cc;}
  .gate{position:fixed; inset:0; background:#f5f7fa; z-index:9; display:flex; align-items:center; justify-content:center; padding:20px;}
  .gate-box{background:#fff; border-radius:14px; padding:28px 24px; width:100%; max-width:340px; box-shadow:0 4px 24px rgba(28,43,58,.12);}
  .gate-box h2{font-size:17px; margin-bottom:6px;}
  .gate-box p{font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.65;}
  .gate-box input{width:100%; padding:10px 12px; font-size:15px; border:1px solid #d7dfe9; border-radius:8px; margin-bottom:10px;}
  .gate-box button{width:100%; background:#24466e; color:#fff; border:none; padding:10px; font-size:14px;}
  .gate-err{color:var(--red); font-size:12px; margin-bottom:8px; min-height:17px;}
  .hidden{display:none;}
  @media (max-width:560px){
    body{padding:16px 8px;}
    td,thead th{padding:9px 8px;}
    td.sym{padding-left:14px;}
    .chip{min-width:72px; font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="gate hidden" id="gate">
  <div class="gate-box">
    <h2>🔒 访问口令</h2>
    <p>个人盯盘页，输入口令进入。口令与详细版相同。</p>
    <div class="gate-err" id="gateErr"></div>
    <form id="gateForm" autocomplete="off">
      <input type="password" id="gateInput" placeholder="访问口令" autofocus>
      <button type="submit" id="gateBtn">进入</button>
    </form>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <h1>买入区监测</h1>
    <div class="count" id="count"></div>
  </div>
  <div class="sub" id="subline">加载中…</div>
  <div class="legend">
    <span><span class="dot" style="background:#22a06b"></span>区内绿色</span>
    <span><span class="dot" style="background:#f5a623"></span>上方 0-10% 黄</span>
    <span><span class="dot" style="background:#e5446d"></span>&gt;10% 红色</span>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>标的</th><th>前收盘 $</th><th>现价 $</th><th>买入区 $</th><th>高于上沿</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5" style="color:var(--muted)">加载策略与行情…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="toolbar">
    <div class="foot" id="footNote">区内按偏离度排序 · 偏离 = 现价 ÷ 上沿 − 1</div>
    <button id="refreshBtn">刷新行情</button>
  </div>
  <div class="foot">
    <span id="srcNote"></span> · <a href="/full" id="fullLink">详细版（阶梯图 / 提醒 / 编辑）</a>
  </div>
</div>

<script>
/* ================= 运行环境 ================= */
var HOSTED = !(
  location.hostname === "localhost" || location.hostname === "127.0.0.1" ||
  /^192\.168\./.test(location.hostname) || /^10\./.test(location.hostname) ||
  /^172\.(1[6-9]|2\d|3[01])\./.test(location.hostname)
);
var TOKEN_KEY = "watch_token_v1";
function getToken(){
  try{ return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ""; }
  catch(e){ return ""; }
}
function authHeaders(){ return HOSTED ? { "x-watch-token": getToken() } : {}; }
function showGate(msg){
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("gateErr").textContent = msg || "";
  try{ document.getElementById("gateInput").focus(); }catch(e){}
}
function hideGate(){ document.getElementById("gate").classList.add("hidden"); }

document.getElementById("gateForm").onsubmit = function(ev){
  ev.preventDefault();
  var pw = document.getElementById("gateInput").value.trim();
  if(!pw) return;
  var btn = document.getElementById("gateBtn"), err = document.getElementById("gateErr");
  btn.disabled = true; btn.textContent = "验证中…"; err.textContent = "";
  fetch("/api/watch?mode=auth", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: pw })
  }).then(function(r){
    if(r.status === 500) throw new Error("服务端还没配 WATCH_PASSWORD");
    if(r.status === 401) throw new Error("口令不对，再试");
    if(!r.ok) throw new Error("服务异常 " + r.status);
    return r.json();
  }).then(function(){
    try{ localStorage.setItem(TOKEN_KEY, pw); sessionStorage.setItem(TOKEN_KEY, pw); }catch(e){}
    hideGate(); boot();
  }).catch(function(e){
    err.textContent = e.message || "验证失败";
  }).finally(function(){
    btn.disabled = false; btn.textContent = "进入";
    document.getElementById("gateInput").value = "";
  });
};

/* ================= 分组映射 ================= */
var GROUPS = [
  { key: "必买",      label: "Must buy" },
  { key: "强烈建议买", label: "强烈建议" },
  { key: "波段买区",   label: "短期波段" },
  { key: "特殊机会",   label: "特殊" }
];
function groupOf(zoneName){
  var n = String(zoneName || "").trim();
  for(var i=0;i<GROUPS.length;i++){ if(n.indexOf(GROUPS[i].key) === 0) return GROUPS[i].key; }
  return "";
}

/* ================= 数据加载 ================= */
var CONFIG = null;
function fetchJSON(url, timeout, headers){
  var ctrl = null;
  if(typeof AbortController !== "undefined") ctrl = new AbortController();
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, timeout || 10000);
  return fetch(url, { headers: headers || {}, signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){
      clearTimeout(t);
      if(r.status === 401 && HOSTED){ showGate("口令已失效，重新输入"); throw new Error("unauthorized"); }
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
}
function loadConfig(){
  return fetchJSON(HOSTED ? "/api/watch?mode=config" : "/config", 10000, authHeaders());
}
function loadQuote(sym){
  return fetchJSON((HOSTED ? "/api/watch?mode=quote&sym=" : "/quote?sym=") + encodeURIComponent(sym), 10000, authHeaders())
    .catch(function(){ return null; });
}

/* ================= 渲染 ================= */
function fmt(n){
  if(n == null || !isFinite(n)) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function chip(dev){
  if(dev == null || !isFinite(dev)) return '<span class="chip n">—</span>';
  var pctv = dev * 100;
  var cls = pctv <= 0 ? "g" : (pctv <= 10 ? "a" : "r");
  var sign = pctv > 0 ? "+" : "";
  return '<span class="chip ' + cls + '">' + sign + pctv.toFixed(2) + "%</span>";
}
function statusColor(dev){
  if(dev == null || !isFinite(dev)) return "#d7dfe9";
  var pctv = dev * 100;
  return pctv <= 0 ? "#22a06b" : (pctv <= 10 ? "#f5a623" : "#e5446d");
}

function render(){
  if(!CONFIG) return;
  var stocks = CONFIG.stocks || [];
  // 组装行数据
  var rows = stocks.map(function(st){
    var zone = (st.zones && st.zones.length) ? st.zones[0] : null;
    var upper = null, lower = null, zoneText = "—", gkey = "";
    if(zone){
      upper = Math.max(zone.from, zone.to);
      lower = Math.min(zone.from, zone.to);
      zoneText = zone.cap ? ("≤" + upper) : (lower === upper ? String(upper) : (lower + "–" + upper));
      gkey = groupOf(zone.name);
    }
    return { st: st, upper: upper, lower: lower, zoneText: zoneText, gkey: gkey, q: null, dev: null };
  });

  var tbody = document.getElementById("tbody");
  function paint(){
    var counts = GROUPS.map(function(g){
      return rows.filter(function(r){ return r.gkey === g.key; }).length;
    }).filter(function(n){ return n > 0; });
    document.getElementById("count").textContent = counts.join("+");

    var html = "";
    GROUPS.forEach(function(g){
      var list = rows.filter(function(r){ return r.gkey === g.key; })
        .sort(function(a,b){ return (a.dev==null?1e9:a.dev) - (b.dev==null?1e9:b.dev); });
      if(!list.length) return;
      html += '<tr class="grp"><td colspan="3">' + g.label + '</td><td colspan="2">' + list.length + "只</td></tr>";
      list.forEach(function(r){
        var barColor = statusColor(r.dev);
        html += "<tr>" +
          '<td class="sym"><span class="bar" style="background:' + barColor + '"></span>' + r.st.symbol + "</td>" +
          '<td class="prev">' + (r.q ? fmt(r.q.prevClose) : "—") + "</td>" +
          '<td class="now">' + (r.q ? fmt(r.q.price) : "—") + "</td>" +
          "<td>" + r.zoneText + "</td>" +
          '<td class="dev">' + chip(r.dev) + "</td>" +
          "</tr>";
      });
    });
    // 无分区的票（如 CRCL）
    var others = rows.filter(function(r){ return !r.gkey; });
    if(others.length){
      html += '<tr class="grp"><td colspan="3">其他监测</td><td colspan="2">' + others.length + "只</td></tr>";
      others.forEach(function(r){
        var lv = (r.st.levels || []).map(function(l){ return l.label + " " + l.price; }).join(" · ");
        html += "<tr>" +
          '<td class="sym"><span class="bar" style="background:#d7dfe9"></span>' + r.st.symbol + "</td>" +
          '<td class="prev">' + (r.q ? fmt(r.q.prevClose) : "—") + "</td>" +
          '<td class="now">' + (r.q ? fmt(r.q.price) : "—") + "</td>" +
          '<td colspan="2" style="font-size:13px; color:#5a6b80">' + (lv || "—") + "</td>" +
          "</tr>";
      });
    }
    tbody.innerHTML = html || '<tr><td colspan="5" style="color:var(--muted)">策略里没有带买入区的标的</td></tr>';
  }

  // 先用现有行情画一遍，再拉新行情
  paint();

  var symbols = rows.map(function(r){ return r.st.symbol; });
  Promise.all(symbols.map(function(sym){
    return loadQuote(sym).then(function(q){
      var row = null;
      for(var i=0;i<rows.length;i++){ if(rows[i].st.symbol === sym){ row = rows[i]; break; } }
      if(row){
        row.q = q;
        row.dev = (q && q.price > 0 && row.upper) ? (q.price / row.upper - 1) : null;
      }
    });
  })).then(function(){
    paint();
    var now = new Date();
    function p2(n){ return (n<10?"0":"")+n; }
    var dateStr = now.getFullYear() + "/" + p2(now.getMonth()+1) + "/" + p2(now.getDate());
    var timeStr = p2(now.getHours()) + ":" + p2(now.getMinutes());
    var srcs = {};
    rows.forEach(function(r){ if(r.q && r.q.src) srcs[r.q.src] = 1; });
    var srcText = Object.keys(srcs).join("/") || "—";
    document.getElementById("subline").textContent = dateStr + " 美股 · " + timeStr + " 更新";
    document.getElementById("srcNote").textContent = "来源：" + srcText + "（服务端代理）";
  });
}

/* ================= 启动 ================= */
var timer = null;
function startTimer(){
  if(timer) clearInterval(timer);
  var sec = (CONFIG && CONFIG.interval) ? CONFIG.interval : 60;
  if(sec > 0) timer = setInterval(function(){ render(); }, sec * 1000);
}
function boot(){
  loadConfig().then(function(cfg){
    CONFIG = cfg;
    render();
    startTimer();
  }).catch(function(e){
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="5" style="color:var(--red)">策略加载失败：' + (e.message || e) + "</td></tr>";
  });
}
document.getElementById("refreshBtn").onclick = function(){ if(CONFIG) render(); else boot(); };
if(HOSTED && !getToken()){ showGate(""); }
else { boot(); }
</script>
</body>
</html>
